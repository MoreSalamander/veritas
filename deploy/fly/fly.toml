# Veritas Dynamics — hosted wedge on Fly.io.
# Copy this to the repo root (or run `fly deploy -c deploy/fly/fly.toml`). Rename `app` to something
# unique to your Fly org. ANTHROPIC_API_KEY is NOT here — set it with `fly secrets set` (see README).

app = "veritas-dynamics-software"   # lowercase only; becomes <name>.fly.dev
primary_region = "iad"           # <- pick a region near you (fly platform regions)

[build]
  dockerfile = "Dockerfile"   # resolved relative to THIS file's folder (deploy/fly/)

[env]
  VERITAS_SANDBOX = "container"   # untrusted code runs in throwaway containers; the wedge fails closed
  VERITAS_MEMORY = "sqlite"       # per-tenant DB-backed memory
  VERITAS_ACCOUNTS = "1"          # real signup/login (not static tokens)
  VERITAS_PUBLIC = "1"            # serve ONLY the wedge; admin surface is sealed off
  VERITAS_MODEL = "sonnet"        # hosted default model: haiku | sonnet | opus
  VERITAS_WEDGE_QUOTA = "20"      # runs per tenant per window (rate limit + billing ledger)
  VERITAS_WEDGE_QUOTA_WINDOW = "86400"
  VERITAS_WEDGE_UNLIMITED = "owner"  # comma-separated usernames exempt from the quota (your account)
  VERITAS_DATA = "/data"          # all state lives on the Volume below

[http_service]
  internal_port = 8099
  force_https = true
  auto_stop_machines = false      # keep dockerd + the warm image resident (avoid cold re-pull)
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/wedge/status"     # public, no secrets; reports whether the sandbox is live
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"          # first boot is slow: dockerd comes up, then pulls the sandbox image

# Persistent storage — a Fly Machine's local disk is ephemeral. accounts.db, usage.db, per-tenant
# memory, and the docker image cache ALL live here, or they vanish on every redeploy.
[mounts]
  source = "veritas_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024"                  # room for dockerd + a 256m sandbox container

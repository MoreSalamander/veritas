[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas"
version = "0.0.0"
description = "Veritas Dynamics — reliable autonomous organizations. The engine."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Capability extras, named for what they enable — the web stack itself lives in
# entropy-os now (the front door is the only web process).
ingest = ["yt-dlp>=2024.0", "httpx>=0.27", "trafilatura>=1.8", "certifi>=2024.0"]
claude = ["anthropic>=0.40"]
web = ["playwright>=1.50"]  # Web Studio renders in a real browser: after install, run `playwright install chromium`
datahub = ["acryl-datahub>=0.14"]
etl = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "mypy>=1.8", "httpx>=0.27", "anthropic>=0.40", "playwright>=1.50", "yt-dlp>=2024.0", "acryl-datahub>=0.14", "trafilatura>=1.8", "certifi>=2024.0", "psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["engine*", "orgs*", "collector*", "products*", "commons*"]

# The container builders bake vendored assets into their images at build
# time; a pip install of this library must carry them or the modules can't
# import anywhere but a source checkout (found the hard way on the first
# hosted boot).
[tool.setuptools.package-data]
"products.tutorial" = ["static/vendor/prism/*"]
"products.academy" = ["static/vendor/prism/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]  # so tests can import bench/ (the formalized experiments), not just the installed packages

[tool.mypy]
python_version = "3.11"
strict = true
files = ["engine", "orgs", "collector", "products", "commons"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yt_dlp"
ignore_missing_imports = true
